<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111214">
<link rel="icon" href="assets/icone.png">
<title>Prompteur</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #111214; color: #ececec;
         font: 17px/1.4 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 640px; width: 100%; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  p { color: #9a9ca1; margin: 0 0 24px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 520px) { .choices { grid-template-columns: 1fr; } }
  a { display: block; padding: 22px; border-radius: 16px; background: #1b1c1f; border: 1px solid #2e3035; color: inherit; text-decoration: none; }
  a b { display: block; font-size: 20px; margin-bottom: 4px; }
  a span { color: #9a9ca1; font-size: 15px; }
  a.main { border-color: #ffc94d; }
</style>
</head>
<body>
<main>
  <h1>Prompteur</h1>
  <p>Choisissez le rôle de cet appareil.</p>
  <div class="choices">
    <a class="main" href="remote.html"><b>Régie</b><span>Sur l'iPad : piloter, voir et modifier le texte.</span></a>
    <a href="display.html"><b>Écran</b><span>Sur l'iPhone posé sur le prompteur : affiche le texte.</span></a>
  </div>
</main>

</html>
