<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prompteur">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="display.webmanifest">
<link rel="apple-touch-icon" href="assets/icone.png">
<link rel="icon" href="assets/icone.png">
<title>Prompteur · Écran</title>
<link rel="stylesheet" href="css/stage.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
         font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: max(6px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,.55);
    background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 999px; pointer-events: none;
    transition: opacity .4s;
  }
  #hud .dot { width: 8px; height: 8px; border-radius: 50%; background: #e5484d; }
  #hud[data-state='waiting'] .dot { background: #f5a524; }
  #hud[data-state='connected'] .dot { background: #30a46c; }
  #hud.discreet { opacity: .35; }
  #hud.discreet .label { display: none; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; box-sizing: border-box; text-align: center;
    background: rgba(0,0,0,.88); color: #fff; z-index: 10;
  }
  #overlay[hidden] { display: none; }
  #overlay h1 { font-size: 22px; margin: 0; font-weight: 700; }
  #overlay p { margin: 0; color: #bbb; font-size: 15px; max-width: 460px; line-height: 1.4; }
  #overlay .code { font-size: 34px; letter-spacing: .18em; font-weight: 700; color: #ffc94d; font-variant-numeric: tabular-nums; }
  #overlay button {
    font: inherit; font-size: 17px; font-weight: 600; padding: 12px 26px; border-radius: 12px; border: 0;
    background: #ffc94d; color: #000;
  }
  #overlay .tip { font-size: 13px; color: #888; }
  #mic-prompt {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #ffc94d; color: #000; font-weight: 700; font-size: 16px; padding: 10px 18px; border-radius: 999px;
    z-index: 5; pointer-events: none; white-space: nowrap;
  }
  #mic-prompt[hidden] { display: none; }
  video#keepawake { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage" class="stage">
  <div class="content" id="content"></div>
  <div class="line"></div>
</div>
<div id="hud" data-state="connecting"><span class="dot"></span><span class="label">Connexion…</span></div>
<div id="overlay">
  <h1>Écran du prompteur</h1>
  <p id="overlay-status">Connexion à la régie…</p>
  <div id="overlay-code" class="code" hidden></div>
  <button id="activate" type="button">Activer l'écran</button>
  <p class="tip" id="overlay-tip"></p>
</div>
<div id="mic-prompt" hidden>🎙 Touchez l'écran pour activer le micro</div>
<video id="keepawake" src="assets/veille.mp4" playsinline muted loop preload="auto"></video>
<script type="module" src="js/display.js"></script>
</body>
</html>
